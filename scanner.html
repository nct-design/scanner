<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PDA 圖書連掃盤點工具 (PDA 相容強化版 + 雲端上傳)</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --card: #ffffff;
      --primary: #1a56db;
      --accent: #0e9f6e;
      --cloud: #7e3af2;
      --danger: #e02424;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    body {
      margin: 0;
      padding: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f2937;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .stats-bar .stat-item { text-align: center; }
    .stats-bar .stat-label { font-size: 12px; color: #9ca3af; }
    .stats-bar .stat-val { font-size: 20px; font-weight: 700; color: #34d399; }

    .scan-box {
      background: var(--card);
      border: 2px solid var(--primary);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .scan-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--primary);
      font-weight: 600;
    }
    .focus-badge {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #def7ec;
      color: #03543f;
    }
    .focus-badge.lost {
      background: #fde8e8;
      color: #9b1c1c;
    }
    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    #scanInput {
      flex: 1;
      min-width: 0;
      font-size: 20px;
      font-weight: 700;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      letter-spacing: 1px;
      outline: none;
      background: #f9fafb;
    }
    #scanInput:focus {
      border-color: var(--primary);
      background: #eff6ff;
    }
    .btn-submit {
      background: var(--accent);
      color: #fff;
      padding: 11px 14px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 6px;
      white-space: nowrap;
    }
    .hint-text {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.45;
    }

    .current-card {
      background: var(--card);
      border-left: 6px solid var(--accent);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .card-tag {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .curr-field-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .curr-field-row:last-child {
      margin-bottom: 0;
    }
    .curr-field-label {
      width: 56px;
      font-size: 15px;
      font-weight: 700;
      color: #374151;
      flex-shrink: 0;
    }
    .curr-field-box {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      background: #f9fafb;
      font-family: monospace;
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      min-height: 42px;
      display: flex;
      align-items: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .curr-field-box:hover {
      border-color: var(--primary);
      background: #eff6ff;
    }
    .curr-field-box.qty-box {
      max-width: 120px;
      color: var(--primary);
      text-align: center;
      justify-content: center;
    }

    .prev-card {
      background: #f9fafb;
      border: 1px dashed #9ca3af;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .prev-card span.mono { font-family: monospace; font-weight: 700; font-size: 16px; }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 12px 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-commit-now { background: #1d4ed8; color: #fff; grid-column: span 2; font-size: 15px; }
    .btn-upload { background: var(--cloud); color: #fff; grid-column: span 2; font-size: 17px; }
    .btn-del { background: #fee2e2; color: #b91c1c; }
    .btn-clear { background: #e5e7eb; color: #374151; }

    .options-bar {
      background: var(--card);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .options-bar label { display: flex; align-items: center; gap: 5px; cursor: pointer; }

    .list-box {
      background: var(--card);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .list-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 6px 4px; border-bottom: 1px solid #f3f4f6; text-align: left; }
    th { color: var(--muted); font-size: 12px; }
    td.mono { font-family: monospace; font-size: 15px; font-weight: 600; }
    td.num { text-align: right; font-family: monospace; font-size: 16px; font-weight: 700; color: var(--primary); }
    .row-del {
      background: none;
      color: #9ca3af;
      padding: 2px 6px;
      font-size: 14px;
    }
    .row-del:hover { color: var(--danger); }

    .diag-bar {
      margin-top: 10px;
      font-size: 12px;
      color: #111827;
      background: #e5e7eb;
      padding: 8px 10px;
      border-radius: 6px;
      font-family: monospace;
      line-height: 1.45;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-label">總品項 (行數)</div>
        <div class="stat-val" id="totalItems">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">總冊數</div>
        <div class="stat-val" id="totalQty">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">狀態</div>
        <div class="stat-val" style="font-size:14px; color:#fbbf24;" id="statusMsg">待命中</div>
      </div>
    </div>

    <div class="scan-box" onclick="focusInput()">
      <div class="scan-header">
        <span>掃描 / 實體鍵盤輸入區</span>
        <span class="focus-badge" id="focusBadge">已鎖定輸入</span>
      </div>
      <form class="input-row" onsubmit="handleFormSubmit(event)">
        <input
          type="text"
          id="scanInput"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          inputmode="text"
          enterkeyhint="done"
          placeholder="掃描或輸入 ISBN..."
        />
        <button type="submit" class="btn-submit">確認</button>
      </form>
      <div class="hint-text">
        • 掃描或輸入 <b>ISBN</b> 後按 <b>Enter</b>（或點「確認」）：上一筆存檔，新 ISBN 數量預設 <b>1</b><br/>
        • 支援半形/全形數字與 <b>X</b>，會自動移除連字號或空白；點「存入明細並清空」可立即把目前這筆移入下方明細表
      </div>
    </div>

    <div class="current-card">
      <div class="card-tag">
        <span>▶ 目前這一筆（未存入明細表前可改數量）</span>
        <span style="color:#6b7280; font-weight:normal; font-size:11px;">點擊方格可修改</span>
      </div>
      <div class="curr-field-row">
        <span class="curr-field-label">書號</span>
        <div class="curr-field-box" id="currIsbnBox" onclick="promptCurrentIsbn()">-</div>
      </div>
      <div class="curr-field-row">
        <span class="curr-field-label">數量</span>
        <div class="curr-field-box qty-box" id="currQtyBox" onclick="promptCurrentQty()">-</div>
      </div>
    </div>

    <div class="prev-card">
      <span style="color:#6b7280;">✔ 上一筆已存入：</span>
      <span class="mono" id="prevRecord">無</span>
    </div>

    <div class="options-bar">
      <label>
        <input type="checkbox" id="mergeSameIsbn" onchange="saveSettings()" />
        相同 ISBN 自動累加數量（不勾則分開獨立一行）
      </label>
    </div>

    <div class="btn-grid">
      <button type="button" class="btn-commit-now" onclick="commitCurrentAndReset()">存入目前這筆至明細表</button>
      <button type="button" class="btn-upload" id="btnUpload" onclick="uploadToSheet()">☁ 上傳至 Google 試算表</button>
      <button type="button" class="btn-del" onclick="deleteCurrent()">刪除目前這一筆</button>
      <button type="button" class="btn-clear" onclick="clearAll()">清空全部紀錄</button>
    </div>

    <div class="list-box">
      <div class="list-title">
        <span>已掃描明細（最新在最上方）</span>
        <span style="font-size:12px; color:#6b7280; font-weight:normal;">點擊數量可手動修改</span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:36px;">#</th>
            <th>ISBN</th>
            <th style="text-align:right;">數量</th>
            <th style="width:36px;"></th>
          </tr>
        </thead>
        <tbody id="recordTableBody"></tbody>
      </table>
    </div>

    <div class="diag-bar" id="diagBar">
      診斷資訊：請在上方輸入框打字或按 Enter 測試...
    </div>
  </div>

  <script>
    // ★ 請將你的 Google Apps Script 網頁應用程式網址貼在下方引號內：
    const GAS_URL = 'https://script.google.com/exec';

    let currentItem = null;
    let historyList = [];
    let isComposing = false;

    const scanInput = document.getElementById('scanInput');
    const focusBadge = document.getElementById('focusBadge');
    const diagBar = document.getElementById('diagBar');

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const savedCurr = localStorage.getItem('pda_curr');
        const savedList = localStorage.getItem('pda_list');
        const savedMerge = localStorage.getItem('pda_merge');
        if (savedCurr) currentItem = JSON.parse(savedCurr);
        if (savedList) historyList = JSON.parse(savedList);
        if (savedMerge === 'true') document.getElementById('mergeSameIsbn').checked = true;
      } catch (e) {
        updateDiag('讀取本機儲存失敗：' + e.message);
      }
      render();
      setTimeout(() => focusInput(), 80);
    });

    function saveState() {
      try {
        localStorage.setItem('pda_curr', JSON.stringify(currentItem));
        localStorage.setItem('pda_list', JSON.stringify(historyList));
      } catch (e) {
        updateDiag('寫入本機儲存失敗（可能為無痕或受限瀏覽器）：' + e.message);
      }
    }

    function saveSettings() {
      try {
        localStorage.setItem('pda_merge', document.getElementById('mergeSameIsbn').checked);
      } catch (e) {}
      focusInput();
    }

    function focusInput() {
      try {
        scanInput.focus({ preventScroll: true });
      } catch (e) {
        try { scanInput.focus(); } catch (_) {}
      }
    }

    function normalizeFullWidth(str) {
      return (str || '').replace(/[\uFF01-\uFF5E]/g, ch =>
        String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)
      );
    }

    function cleanIsbn(rawText) {
      const halfWidth = normalizeFullWidth(rawText || '').trim();
      return halfWidth.replace(/[^0-9Xx]/g, '').toUpperCase();
    }

    function updateDiag(extraLine) {
      const currText = currentItem ? `${currentItem.isbn} (數量:${currentItem.qty})` : '無';
      diagBar.innerHTML =
        `${extraLine}<br/>` +
        `輸入框值: "<b>${scanInput.value}</b>" | 目前品項: <b>${currText}</b> | 已存明細: <b>${historyList.length}</b> 筆`;
    }

    scanInput.addEventListener('focus', () => {
      focusBadge.textContent = '已鎖定輸入';
      focusBadge.classList.remove('lost');
    });

    scanInput.addEventListener('blur', () => {
      focusBadge.textContent = '點擊此處恢復輸入';
      focusBadge.classList.add('lost');
    });

    scanInput.addEventListener('compositionstart', () => {
      isComposing = true;
    });

    scanInput.addEventListener('compositionend', () => {
      isComposing = false;
      scanInput.value = normalizeFullWidth(scanInput.value);
      updateDiag('輸入法組字完成');
    });

    function handleFormSubmit(e) {
      if (e) e.preventDefault();
      if (isComposing) return;
      processInput(scanInput.value, '表單確認/Enter');
      focusInput();
    }

    window.addEventListener('keydown', (e) => {
      const targetTag = e.target && e.target.tagName ? e.target.tagName : 'UNKNOWN';
      const keyInfo = `按鍵: key="<b>${e.key}</b>" | code="${e.code || ''}" | keyCode=${e.keyCode || 0} | 焦點: <b>${targetTag}</b>`;

      if (isComposing) {
        updateDiag(keyInfo + '（組字中）');
        return;
      }

      if (document.activeElement !== scanInput && targetTag !== 'BUTTON' && targetTag !== 'INPUT') {
        if (/^[0-9xX]$/.test(normalizeFullWidth(e.key))) {
          focusInput();
        }
      }

      const isEnter = e.key === 'Enter' || e.keyCode === 13;
      const isTab = e.key === 'Tab' || e.keyCode === 9;

      if ((isEnter || isTab) && document.activeElement === scanInput) {
        e.preventDefault();
        processInput(scanInput.value, `按鍵 ${e.key}`);
        focusInput();
        return;
      }

      updateDiag(keyInfo);
    }, true);

    scanInput.addEventListener('input', () => {
      const normalized = normalizeFullWidth(scanInput.value);
      if (scanInput.value !== normalized) {
        scanInput.value = normalized;
      }
      updateDiag('輸入事件觸發');
    });

    function processInput(rawText, sourceLabel = '輸入') {
      const rawTrimmed = (rawText || '').trim();
      const val = cleanIsbn(rawText);
      scanInput.value = '';

      if (!val) {
        if (rawTrimmed) {
          setStatus('ISBN 格式無效');
          updateDiag(`⚠️ 略過無效輸入："${rawTrimmed}"（未含數字或 X）`);
        } else {
          setStatus('輸入為空');
          updateDiag(`⚠️ ${sourceLabel} 時輸入框為空`);
        }
        return;
      }

      if (currentItem) {
        commitCurrentItem();
      }
      currentItem = { isbn: val, qty: 1 };
      setStatus(`✔ 已錄入 ${currentItem.isbn} (數量 1)`);
      saveState();
      render();
      updateDiag(`✔ ${sourceLabel} 成功錄入 <b>${val}</b>`);
    }

    function commitCurrentItem() {
      if (!currentItem) return;
      const shouldMerge = document.getElementById('mergeSameIsbn').checked;
      if (shouldMerge) {
        const existingIdx = historyList.findIndex(item => item.isbn === currentItem.isbn);
        if (existingIdx !== -1) {
          historyList[existingIdx].qty += currentItem.qty;
          const [updated] = historyList.splice(existingIdx, 1);
          historyList.unshift(updated);
          return;
        }
      }
      historyList.unshift({ ...currentItem });
    }

    function commitCurrentAndReset() {
      const pendingVal = cleanIsbn(scanInput.value);
      if (pendingVal) {
        processInput(pendingVal, '存入明細');
      }
      if (!currentItem) {
        setStatus('目前沒有可存入的品項');
        focusInput();
        return;
      }
      const savedIsbn = currentItem.isbn;
      const savedQty = currentItem.qty;
      commitCurrentItem();
      currentItem = null;
      setStatus(`✔ 已存入明細 ${savedIsbn} × ${savedQty}`);
      saveState();
      render();
      updateDiag(`✔ 已將 <b>${savedIsbn}</b> (數量 ${savedQty}) 移入明細表`);
      focusInput();
    }

    function setStatus(msg) {
      document.getElementById('statusMsg').textContent = msg;
    }

    function promptCurrentIsbn() {
      if (!currentItem) return;
      const input = prompt('修改目前這一筆的「書號 (ISBN)」：', currentItem.isbn);
      if (input !== null) {
        const cleaned = cleanIsbn(input);
        if (cleaned) {
          currentItem.isbn = cleaned;
          setStatus(`✔ 書號改為 ${cleaned}`);
          saveState();
          render();
        }
      }
      focusInput();
    }

    function promptCurrentQty() {
      if (!currentItem) return;
      const input = prompt(`修改目前這本 (${currentItem.isbn}) 的「數量」：`, currentItem.qty);
      if (input !== null) {
        const n = parseInt(normalizeFullWidth(input).trim(), 10);
        if (!isNaN(n) && n > 0) {
          currentItem.qty = n;
          setStatus(`✔ 數量改為 ${n}`);
          saveState();
          render();
        }
      }
      focusInput();
    }

    function deleteCurrent() {
      if (!currentItem) return;
      currentItem = null;
      setStatus('已刪除目前這筆');
      saveState();
      render();
      focusInput();
    }

    function clearAll() {
      if (!currentItem && historyList.length === 0) return;
      if (!confirm('確定要清空所有已掃描的資料嗎？')) {
        focusInput();
        return;
      }
      currentItem = null;
      historyList = [];
      setStatus('已全部清空');
      saveState();
      render();
      focusInput();
    }

    function editHistoryQty(index) {
      const target = historyList[index];
      const input = prompt(`修改 ISBN: ${target.isbn} 的數量：`, target.qty);
      if (input !== null) {
        const n = parseInt(normalizeFullWidth(input).trim(), 10);
        if (!isNaN(n) && n > 0) {
          target.qty = n;
          saveState();
          render();
        }
      }
      focusInput();
    }

    function deleteHistoryItem(index) {
      historyList.splice(index, 1);
      saveState();
      render();
      focusInput();
    }

    function render() {
      const isbnBox = document.getElementById('currIsbnBox');
      const qtyBox = document.getElementById('currQtyBox');
      if (currentItem) {
        isbnBox.textContent = currentItem.isbn;
        qtyBox.textContent = currentItem.qty;
      } else {
        isbnBox.textContent = '-';
        qtyBox.textContent = '-';
      }

      if (historyList.length > 0) {
        const prev = historyList[0];
        document.getElementById('prevRecord').textContent = `${prev.isbn}  ×  ${prev.qty}`;
      } else {
        document.getElementById('prevRecord').textContent = '無';
      }

      let totalItems = historyList.length + (currentItem ? 1 : 0);
      let totalQty = historyList.reduce((sum, item) => sum + item.qty, 0) + (currentItem ? currentItem.qty : 0);
      document.getElementById('totalItems').textContent = totalItems;
      document.getElementById('totalQty').textContent = totalQty;

      const tbody = document.getElementById('recordTableBody');
      tbody.innerHTML = '';
      historyList.forEach((item, idx) => {
        const tr = document.createElement('tr');
        const rowNum = historyList.length - idx;
        tr.innerHTML = `
          <td style="color:#9ca3af;">${rowNum}</td>
          <td class="mono">${item.isbn}</td>
          <td class="num" style="cursor:pointer; text-decoration:underline;" onclick="editHistoryQty(${idx})">${item.qty}</td>
          <td><button type="button" class="row-del" onclick="deleteHistoryItem(${idx})">✕</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function uploadToSheet() {
      if (!GAS_URL || GAS_URL.includes('請替換成你的部署ID')) {
        alert('請先在 HTML 程式碼的 GAS_URL 填入你的 Apps Script 網址！');
        focusInput();
        return;
      }

      const pendingVal = cleanIsbn(scanInput.value);
      if (pendingVal) {
        processInput(pendingVal, '上傳前補錄');
      }

      const previewItemsCount = historyList.length + (currentItem ? 1 : 0);
      const previewQtyCount = historyList.reduce((sum, item) => sum + item.qty, 0) + (currentItem ? currentItem.qty : 0);

      if (previewItemsCount === 0) {
        alert('目前沒有任何掃描資料可以上傳！');
        focusInput();
        return;
      }

      if (!confirm('確定要上傳這批盤點資料至 Google 試算表嗎？\n\n總品項：' + previewItemsCount + ' 筆\n總冊數：' + previewQtyCount + ' 冊')) {
        focusInput();
        return;
      }

      if (currentItem) {
        commitCurrentItem();
        currentItem = null;
        saveState();
        render();
      }

      const orderedItems = [...historyList].reverse();

      const btn = document.getElementById('btnUpload');
      const origText = btn.textContent;
      btn.disabled = true;
      btn.textContent = '⏳ 上傳中...';
      setStatus('上傳雲端中...');

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ items: orderedItems })
        });

        const result = await response.json();
        if (result.success) {
          setStatus('✔ 已上傳 ' + result.batchId);
          diagBar.innerHTML = '✔ 上傳成功！批次號碼：<b>' + result.batchId + '</b>（' + result.totalItems + ' 品項 / ' + result.totalQty + ' 冊）';
          const nextOrder = confirm(
            '上傳成功！\n' +
            '批次號碼：' + result.batchId + '\n' +
            '總品項：' + result.totalItems + ' 筆 / 總冊數：' + result.totalQty + ' 冊\n\n' +
            '是否開始「下一單」並刪除目前畫面上的掃描明細？'
          );
          if (nextOrder) {
            currentItem = null;
            historyList = [];
            saveState();
            render();
            setStatus('已清空，準備掃描下一單');
          }
        } else {
          throw new Error(result.error || '試算表回傳失敗');
        }
      } catch (err) {
        setStatus('❌ 上傳失敗');
        diagBar.innerHTML = '❌ 上傳失敗：' + err.message;
        alert('上傳失敗，請確認網路或 GAS 網址：\n' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = origText;
        focusInput();
      }
    }
  </script>
</body>
</html>
