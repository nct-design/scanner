<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUNMI L2Ks ES5 相容診斷頁</title>
  <style>
    body { margin: 0; padding: 12px; font-family: sans-serif; background: #f3f4f6; font-size: 16px; }
    .box { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #ccc; }
    input { width: 100%; font-size: 20px; padding: 10px; margin-bottom: 8px; border: 2px solid #2563eb; box-sizing: border-box; }
    button { padding: 10px 14px; font-size: 16px; margin-right: 6px; margin-bottom: 6px; }
    #statusBox { padding: 8px; background: #fee2e2; color: #991b1b; font-weight: bold; border-radius: 6px; }
    #logBox { background: #111; color: #34d399; padding: 10px; border-radius: 6px; min-height: 160px; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <div id="statusBox">尚未執行 JS（若一直維持這行，表示腳本未執行）</div>
  </div>

  <div class="box">
    <input type="text" id="inp" placeholder="手動輸入或掃碼..." />
    <button type="button" onclick="onBtnClick('確認測試')">測試按鈕</button>
    <button type="button" onclick="onClearLog()">清除紀錄</button>
  </div>

  <div class="box">
    <div id="logBox">等待操作...</div>
  </div>

  <script>
    var statusBox = document.getElementById('statusBox');
    var logBox = document.getElementById('logBox');
    var inp = document.getElementById('inp');
    var logs = [];

    statusBox.style.background = '#d1fae5';
    statusBox.style.color = '#065f46';
    statusBox.innerHTML = 'JS 已成功執行！';

    function pushLog(msg) {
      logs.unshift(msg);
      if (logs.length > 30) logs.pop();
      logBox.innerHTML = logs.join('\n');
    }

    pushLog('頁面已啟動 | UA: ' + navigator.userAgent);

    function onBtnClick(label) {
      pushLog('按鈕點擊: ' + label + ' | 輸入框值: "' + inp.value + '"');
    }

    function onClearLog() {
      logs = [];
      logBox.innerHTML = '已清除';
    }

    inp.oninput = function() {
      pushLog('ONINPUT: "' + inp.value + '"');
    };

    inp.onchange = function() {
      pushLog('ONCHANGE: "' + inp.value + '"');
    };

    document.onkeydown = function(e) {
      e = e || window.event;
      var code = e.keyCode || e.which || 0;
      pushLog('KEYDOWN key=' + (e.key || '') + ' keyCode=' + code + ' val="' + inp.value + '"');
    };
  </script>
</body>
</html>
