<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SUNMI L2Ks 瀏覽器與掃碼診斷工具</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 12px; background: #f3f4f6; color: #111827; font-size: 16px; }
    .box { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid #d1d5db; }
    h2 { margin: 0 0 8px 0; font-size: 17px; color: #1d4ed8; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; font-size: 20px; padding: 10px; border: 2px solid #2563eb; border-radius: 8px; }
    button { padding: 10px 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; background: #059669; color: #fff; }
    button.gray { background: #4b5563; }
    #log { background: #111827; color: #34d399; font-family: monospace; font-size: 13px; padding: 10px; border-radius: 8px; min-height: 220px; max-height: 360px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; background: #dbeafe; color: #1e40af; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>1. 環境與 JS 執行檢查</h2>
    <div id="envInfo" class="badge">正在檢查 JavaScript...</div>
    <div style="font-size:13px; color:#4b5563;">如果上方變成綠色「JS 正常運作中」，代表網頁腳本有正常載入。</div>
  </div>

  <div class="box">
    <h2>2. 輸入框與掃碼測試</h2>
    <div class="row">
      <input type="text" id="testInput" placeholder="點此輸入或按掃碼鍵..." autocomplete="off" />
      <button type="button" id="btnTest">測試按鈕</button>
    </div>
    <div style="margin-top:8px; display:flex; gap:8px;">
      <button type="button" class="gray" id="btnFocus">強制聚焦輸入框</button>
      <button type="button" class="gray" id="btnClear">清除紀錄</button>
    </div>
  </div>

  <div class="box">
    <h2>3. 即時事件紀錄（請截圖或貼給我看）</h2>
    <div id="log">等待操作...</div>
  </div>

  <script>
    var logEl = document.getElementById('log');
    var inputEl = document.getElementById('testInput');
    var envEl = document.getElementById('envInfo');
    var lines = [];

    function addLog(msg) {
      var now = new Date();
      var t = String(now.getHours()).padStart(2, '0') + ':' +
              String(now.getMinutes()).padStart(2, '0') + ':' +
              String(now.getSeconds()).padStart(2, '0');
      lines.unshift('[' + t + '] ' + msg);
      if (lines.length > 40) lines.pop();
      logEl.textContent = lines.join('
');
    }

    // 1. 啟動檢查
    envEl.textContent = '✔ JS 正常運作中';
    envEl.style.background = '#d1fae5';
    envEl.style.color = '#065f46';
    addLog('頁面載入完成 | URL: ' + location.href);
    addLog('瀏覽器 UA: ' + navigator.userAgent);

    // 2. 監聽輸入框事件
    inputEl.addEventListener('focus', function() {
      addLog('INPUT focus (輸入框取得焦點)');
    });
    inputEl.addEventListener('blur', function() {
      addLog('INPUT blur (輸入框失去焦點)');
    });
    inputEl.addEventListener('input', function(e) {
      addLog('INPUT input | 目前值="' + inputEl.value + '" | inputType=' + (e.inputType || 'none'));
    });
    inputEl.addEventListener('change', function() {
      addLog('INPUT change | 目前值="' + inputEl.value + '"');
    });

    // 3. 監聽按鍵事件
    document.addEventListener('keydown', function(e) {
      addLog('KEYDOWN | key="' + e.key + '" | keyCode=' + (e.keyCode || e.which) + ' | code="' + (e.code || '') + '"');
    }, true);

    document.addEventListener('keyup', function(e) {
      addLog('KEYUP | key="' + e.key + '" | keyCode=' + (e.keyCode || e.which) + ' | 輸入框值="' + inputEl.value + '"');
    }, true);

    // 4. 監聽觸控與點擊
    document.getElementById('btnTest').addEventListener('click', function() {
      addLog('CLICK 測試按鈕 | 目前輸入框值="' + inputEl.value + '"');
      inputEl.value = '';
      inputEl.focus();
    });

    document.getElementById('btnFocus').addEventListener('click', function() {
      inputEl.focus();
      addLog('CLICK 強制聚焦輸入框');
    });

    document.getElementById('btnClear').addEventListener('click', function() {
      lines = [];
      logEl.textContent = '已清除紀錄';
    });
  </script>
</body>
</html>
